app = "frontal-orbit-slack"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.slack"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  PORT = "3000"
  ORBIT_API_URL = "https://frontal-orbit.fly.dev"

[http_service]
  internal_port = 3000
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
