apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbit-server
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: orbit.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orbit-server
                port:
                  number: 8788
