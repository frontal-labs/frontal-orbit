upstream orbit_backend {
    server orbit-server:8788;
}

server_tokens off;

# Rate limiting
limit_req_zone $binary_remote_addr zone=orbit_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=orbit_tasks:10m rate=5r/s;

server {
    listen 80;
    server_name tools.frontal.dev;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    
    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tools.frontal.dev;
    
    # SSL configuration
    ssl_certificate /etc/ssl/certs/tools-frontal-dev.crt;
    ssl_certificate_key /etc/ssl/private/tools-frontal-dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    
    # Logging
    access_log /var/log/nginx/tools.access.log;
    error_log /var/log/nginx/tools.error.log;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Orbit API routes
    location /orbit/ {
        # Remove /orbit prefix for upstream
        rewrite ^/orbit/(.*)$ /$1 break;
        
        # Rate limiting for API endpoints
        limit_req zone=orbit_api burst=20 nodelay;
        
        # Proxy settings
        proxy_pass http://orbit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Body size
        client_max_body_size 10M;
    }
    
    # Specific task endpoints with stricter rate limiting
    location ~ ^/orbit/api/v1/tasks/ {
        # Rate limiting for task endpoints
        limit_req zone=orbit_tasks burst=10 nodelay;
        
        # Remove /orbit prefix for upstream
        rewrite ^/orbit/(.*)$ /$1 break;
        
        # Proxy settings
        proxy_pass http://orbit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts for long-running tasks
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Body size for task payloads
        client_max_body_size 50M;
    }
    
    # Webhook endpoints
    location ~ ^/orbit/webhooks/ {
        # Remove /orbit prefix for upstream
        rewrite ^/orbit/(.*)$ /$1 break;
        
        # Proxy settings for webhooks
        proxy_pass http://orbit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts for webhook processing
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Body size for webhook payloads
        client_max_body_size 5M;
    }
    
    # Default location for tools landing page
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
