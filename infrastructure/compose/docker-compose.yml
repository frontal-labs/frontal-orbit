services:
  orbit-server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/orbit-server.Dockerfile
    image: orbit-server:latest
    restart: unless-stopped
    environment:
      ORBIT_SERVER_HOST: ${ORBIT_SERVER_HOST:-0.0.0.0}
      ORBIT_SERVER_PORT: ${ORBIT_SERVER_PORT:-8788}
      ORBIT_SERVER_LANE_TRANSPORT: ${ORBIT_SERVER_LANE_TRANSPORT:-tools-agent}
      ORBIT_SERVER_WORKSPACE_ROOT: ${ORBIT_SERVER_WORKSPACE_ROOT:-/workspace/workspaces}
      ORBIT_SERVER_DOCKER_IMAGE: ${ORBIT_SERVER_DOCKER_IMAGE:-orbit-worker:latest}
      ORBIT_SERVER_CALLBACK_URL: ${ORBIT_SERVER_CALLBACK_URL:-http://host.docker.internal:8788}
      ORBIT_SERVER_RECONCILE_INTERVAL_SECS: ${ORBIT_SERVER_RECONCILE_INTERVAL_SECS:-15}
      ORBIT_SERVER_ORPHAN_APPROVAL_DELAY_SECS: ${ORBIT_SERVER_ORPHAN_APPROVAL_DELAY_SECS:-0}
      ORBIT_SERVER_ORPHAN_AUTO_RETRY_SECS: ${ORBIT_SERVER_ORPHAN_AUTO_RETRY_SECS:-0}
      ORBIT_SERVER_ORPHAN_AUTO_CANCEL_SECS: ${ORBIT_SERVER_ORPHAN_AUTO_CANCEL_SECS:-0}
      ORBIT_SERVER_ORPHAN_POLICY_RULES: ${ORBIT_SERVER_ORPHAN_POLICY_RULES:-[]}
      ORBIT_SERVER_STATE_FILE: ${ORBIT_SERVER_STATE_FILE:-/var/lib/orbit/server/state.json}
      ORBIT_AGENT_STORE: ${ORBIT_AGENT_STORE:-/var/lib/orbit/agents}
      RUST_LOG: ${RUST_LOG:-info}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      FRONTAL_API_KEY: ${FRONTAL_API_KEY:-}
      FRONTAL_BASE_URL: ${FRONTAL_BASE_URL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      BEDROCK_BASE_URL: ${BEDROCK_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    working_dir: /workspace
    volumes:
      - orbit_workspace:/workspace
      - orbit_server_state:/var/lib/orbit/server
      - orbit_agent_store:/var/lib/orbit/agents
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8788:8788"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  orbit-worker-image:
    build:
      context: ../..
      dockerfile: infrastructure/docker/orbit-worker.Dockerfile
    image: orbit-worker:latest
    command: ["orbit", "--version"]
    restart: "no"
    profiles: ["worker-image"]

  orbit-slack:
    build:
      context: ../..
      dockerfile: infrastructure/docker/orbit-slack.Dockerfile
    image: orbit-slack:latest
    restart: unless-stopped
    environment:
      ORBIT_API_URL: ${ORBIT_API_URL:-http://orbit-server:8788}
      ORBIT_API_TIMEOUT: ${ORBIT_API_TIMEOUT:-30000}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: ${PORT:-3000}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-10}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-3600000}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-30000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      orbit-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof node >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  orbit_workspace:
  orbit_server_state:
  orbit_agent_store:
