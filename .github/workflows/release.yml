name: Release Frontal Orbit Code binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            bin: orbit
            artifact_name: orbit-linux-x64.tar.gz
          - name: macos-arm64
            os: macos-14
            bin: orbit
            artifact_name: orbit-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-13
            bin: orbit
            artifact_name: orbit-macos-x64.tar.gz
          - name: windows-x64
            os: windows-2022
            bin: orbit.exe
            artifact_name: orbit-windows-x64.exe
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build release binary
        run: cargo build --release -p orbit-cli

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist/package/bin
          cp "target/release/${{ matrix.bin }}" "dist/package/bin/${{ matrix.bin }}"

          if [[ "${{ matrix.bin }}" == *.exe ]]; then
            cp "dist/package/bin/${{ matrix.bin }}" "dist/${{ matrix.artifact_name }}"
          else
            chmod +x "dist/package/bin/${{ matrix.bin }}"
            tar -C dist/package -czf "dist/${{ matrix.artifact_name }}" .
          fi

          shasum -a 256 "dist/${{ matrix.artifact_name }}" > "dist/${{ matrix.artifact_name }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
          fail_on_unmatched_files: true
