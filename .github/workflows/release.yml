name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build all platform binaries (CLI + server) ──────────────────────────
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: .exe
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Set build-time env
        shell: bash
        run: |
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build orbit (CLI)
        shell: bash
        run: cargo build --release -p orbit-cli --target "${{ matrix.target }}"

      - name: Build orbit-server
        if: ${{ matrix.name == 'linux-x64' }}
        shell: bash
        run: |
          cargo build --release -p orbit-server --target "${{ matrix.target }}"

      - name: Package CLI artifact
        shell: bash
        run: |
          mkdir -p dist/package/bin
          bin="orbit${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/package/bin/${bin}"

          if [[ -n "${{ matrix.ext }}" ]]; then
            cp "dist/package/bin/${bin}" "dist/orbit-${{ matrix.name }}${{ matrix.ext }}"
          else
            chmod +x "dist/package/bin/${bin}"
            tar -C dist/package -czf "dist/orbit-${{ matrix.name }}.tar.gz" .
            shasum -a 256 "dist/orbit-${{ matrix.name }}.tar.gz" > "dist/orbit-${{ matrix.name }}.tar.gz.sha256"
          fi

      - name: Package server artifact (linux only)
        if: ${{ matrix.name == 'linux-x64' }}
        shell: bash
        run: |
          mkdir -p dist/server/package/bin
          cp "target/${{ matrix.target }}/release/orbit-server" "dist/server/package/bin/orbit-server"
          chmod +x "dist/server/package/bin/orbit-server"
          tar -C dist/server/package -czf "dist/orbit-server-${{ matrix.name }}.tar.gz" .
          shasum -a 256 "dist/orbit-server-${{ matrix.name }}.tar.gz" > "dist/orbit-server-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/orbit-*

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/orbit-*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ── Extract changelog for the release body ──────────────────────────────
  changelog:
    name: Extract changelog
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      body: ${{ steps.extract.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version entry from CHANGELOG.md
        id: extract
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          body=$(awk -v ver="$version" '
            BEGIN { found=0; buf="" }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { buf = buf $0 "\n" }
            END { print buf }
          ' CHANGELOG.md)
          {
            echo 'body<<EOF'
            echo "$body"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  # ── Publish server Docker image to GHCR ─────────────────────────────────
  docker-server:
    name: Publish server image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/orbit-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fly
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Update Homebrew formula sha256s ─────────────────────────────────────
  homebrew:
    name: Update Homebrew formula
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true

      - name: Update sha256 placeholders in formula
        shell: bash
        run: |
          arm64_sha=$(cat orbit-macos-arm64.tar.gz.sha256 | awk '{print $1}')
          x64_sha=$(cat orbit-macos-x64.tar.gz.sha256 | awk '{print $1}')

          sed -i "s/<INSERT_ARM64_SHA256>/${arm64_sha}/" homebrew/orbit.rb
          sed -i "s/<INSERT_X64_SHA256>/${x64_sha}/" homebrew/orbit.rb

      - name: Commit and push formula update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet homebrew/orbit.rb; then
            echo "No sha256 changes; skipping commit."
            exit 0
          fi
          git add homebrew/orbit.rb
          git commit -m "chore: update Homebrew sha256 for ${GITHUB_REF#refs/tags/}"
          git push origin main
