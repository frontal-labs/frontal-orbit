name: Frontal Orbit Code CI

on:
  push:
    branches:
      - main
      - 'develop/**'
      - 'feature/*'
      - 'fix/*'
      - 'hotfix/*'
    paths:
      - .github/workflows/rust-ci.yml
      - .github/scripts/check_doc_source_of_truth.py
      - README.md
      - USAGE.md
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - extensions/orbit-slack/**
      - scripts/**
      - docs/**
      - sdk/rust/**
      - sdk/typescript/**
      - biome.json
      - ultracite.json
      - bunfig.toml
      - tools/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rust-ci.yml
      - .github/scripts/check_doc_source_of_truth.py
      - README.md
      - USAGE.md
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - extensions/orbit-slack/**
      - scripts/**
      - docs/**
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

env:
  CARGO_TERM_COLOR: always

jobs:
  doc-source-of-truth:
    name: docs source-of-truth
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check docs and metadata for stale branding
        run: python .github/scripts/check_doc_source_of_truth.py

  fmt:
    name: cargo fmt
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check formatting
        run: cargo fmt --all --check

  test-workspace:
    name: cargo test --workspace
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Run workspace tests
        run: cargo test --workspace

  slack-extension-ci:
    name: slack contract + build + lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: extensions/orbit-slack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/orbit-slack/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install Slack extension dependencies
        run: npm ci
      - name: Check generated contract freshness and Slack build
        run: npm run build
      - name: Run Slack extension lint checks
        continue-on-error: true
        run: npm run lint

  clippy-workspace:
    name: cargo clippy --workspace
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Run workspace clippy
        run: cargo clippy --workspace
