name: Lint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint.yml'
      - 'MODULE.bazel'
      - '.bazelversion'
      - '.bazelrc'
      - 'bazel/**'
      - 'third_party/**'
      - 'tools/**'
      - 'scripts/**'
      - 'sdk/**'
      - 'biome.json'
      - 'ultracite.json'
      - 'bunfig.toml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint.yml'
      - 'MODULE.bazel'
      - '.bazelversion'
      - '.bazelrc'
      - 'bazel/**'
      - 'third_party/**'
      - 'tools/**'
      - 'scripts/**'
      - 'sdk/**'
      - 'biome.json'
      - 'ultracite.json'
      - 'bunfig.toml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit --all-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
