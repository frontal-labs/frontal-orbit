name: Orbit CLI npm

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/npm-cli.yml'
      - 'orbit-cli/**'
      - 'scripts/cli.sh'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/npm-cli.yml'
      - 'orbit-cli/**'
      - 'scripts/cli.sh'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-cli-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: orbit-cli npm verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (skip postinstall download)
        working-directory: orbit-cli
        # --ignore-scripts avoids the postinstall network download in CI;
        # verify.sh runs the test suite and pack dry-run checks instead.
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Verify package (syntax, tests, pack)
        working-directory: orbit-cli
        run: ./scripts/verify.sh

      - name: Build native binary locally (smoke test)
        # Optional smoke test: build the Rust binary and confirm the launcher
        # can resolve and exec it. Only runs where cargo is preinstalled.
        if: ${{ matrix.build-binary == true }}
        run: |
          (command -v cargo >/dev/null 2>&1 && \
            cargo build --release -p orbit-cli && \
            ./scripts/build.sh && \
            node ./bin/orbit.js --version) || echo "cargo unavailable; skipping binary smoke test"
