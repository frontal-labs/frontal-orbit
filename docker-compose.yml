version: '3.8'

services:
  # Orbit main service
  orbit:
    build:
      context: .
      dockerfile: Dockerfile
    image: orbit-code:latest
    container_name: orbit-code
    restart: unless-stopped
    
    # Environment variables
    environment:
      - RUST_LOG=info
      - CARGO_TERM_COLOR=always
      - ORBIT_HOME=/workspace/.orbit
      - SANDBOX_HOME=/workspace/.sandbox-home
      - DATABASE_URL=postgresql://orbit:orbit_password@postgres:5432/orbit_db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ORBIT_CONFIG_HOME=/workspace/.orbit/config
    
    # Volumes for persistence
    volumes:
      - orbit_data:/workspace/.orbit
      - sandbox_data:/workspace/.sandbox-home
      - ./crates:/workspace/crates:ro
      - ./Cargo.toml:/workspace/Cargo.toml:ro
      - ./Cargo.lock:/workspace/Cargo.lock:ro
    
    # Port mapping (for web interface if needed)
    ports:
      - "8080:8080"
    
    # Network
    networks:
      - orbit_network
    
    # Health check
    healthcheck:
      test: ["CMD", "orbit", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL database for structured memory
  postgres:
    image: postgres:15-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    
    environment:
      - POSTGRES_DB=orbit_db
      - POSTGRES_USER=orbit
      - POSTGRES_PASSWORD=orbit_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    
    networks:
      - orbit_network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    ports:
      - "5432:5432"

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: unless-stopped
    
    command: redis-server --appendonly yes --requirepass redis_password
    
    volumes:
      - redis_data:/data
    
    networks:
      - orbit_network
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    
    ports:
      - "6379:6379"

  # Vector database (Qdrant) for semantic search
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: orbit-qdrant
    restart: unless-stopped
    
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    
    volumes:
      - qdrant_data:/qdrant/storage
    
    networks:
      - orbit_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    ports:
      - "6333:6333"
      - "6334:6334"

  # Webhook receiver for external events
  webhook-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: orbit-code:latest
    container_name: orbit-webhook
    restart: unless-stopped
    
    command: ["orbit", "server", "--webhook-port", "8555"]
    
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://orbit:orbit_password@postgres:5432/orbit_db
      - REDIS_URL=redis://:redis_password@redis:6379
      - QDRANT_URL=http://qdrant:6333
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-orbit_webhook_secret}
    
    volumes:
      - orbit_data:/workspace/.orbit
    
    networks:
      - orbit_network
    
    ports:
      - "8555:8555"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # Development service with hot reload
  orbit-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: orbit-code:dev
    container_name: orbit-dev
    restart: "no"
    
    environment:
      - RUST_LOG=debug
      - CARGO_TERM_COLOR=always
      - DATABASE_URL=postgresql://orbit:orbit_password@postgres:5432/orbit_db
      - REDIS_URL=redis://:redis_password@redis:6379
      - QDRANT_URL=http://qdrant:6333
    
    volumes:
      - ./:/workspace
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/workspace/target
    
    networks:
      - orbit_network
    
    ports:
      - "8080:8080"
      - "8555:8555"
    
    profiles:
      - dev

# Networks
networks:
  orbit_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  orbit_data:
    driver: local
  sandbox_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  cargo_cache:
    driver: local
  target_cache:
    driver: local