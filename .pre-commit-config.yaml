repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: cargo-check
        args: ['--workspace', '--all-targets', '--all-features']
      - id: clippy
        args: ['--workspace', '--all-targets', '--all-features', '--', '-D', 'warnings']
      - id: rust-fmt
        args: ['--']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args:
          - '--ignore-words-list=crate,serde,clippy,struct,impl,fn,mut,async,await'
          - '--skip=*.lock,*.sum,target/,Cargo.lock'

  - repo: https://github.com/r0x0r/pre-commit-rustsec
    rev: v1.0.0
    hooks:
      - id: cargo-audit
        args: ['--workspace']

  # --- Bazel / polyglot tooling (added by the Bzlmod migration) ---------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        files: '.*\.md$'

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 2.7.3
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # --- Biome (Ultracite preset) for TS/JS/JSON/YAML formatting & lint ------
  # Replaces prettier: Biome is the single formatter/linter for the monorepo's
  # TypeScript and JavaScript surface (including the Orbit SDKs).
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: bunx @biomejs/biome check --write --no-errors-on-unmatched
        language: system
        types_or: [file]
        files: '\.(ts|tsx|js|jsx|json|jsonc|ya?ml)$'
        pass_filenames: false
        always_run: true

      - id: biome-format
        name: biome format
        entry: bunx @biomejs/biome format --write --no-errors-on-unmatched
        language: system
        types_or: [file]
        files: '\.(ts|tsx|js|jsx|json|jsonc|ya?ml)$'
        pass_filenames: false
        always_run: true

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        files: '(\.devcontainer/Dockerfile|infrastructure/docker/.*\.Dockerfile|extensions/orbit-slack/Dockerfile|sdk/Dockerfile|infrastructure/proxy/Dockerfile)$'

  - repo: local
    hooks:
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --workspace --no-deps --document-private-items
        language: system
        pass_filenames: false
        always_run: true

      - id: orbit-doctor
        name: orbit doctor
        entry: cargo run --bin orbit -- doctor
        language: system
        pass_filenames: false
        always_run: true

      - id: check-cargo-lock
        name: check Cargo.lock
        entry: cargo check --locked --workspace
        language: system
        pass_filenames: false
        always_run: true

      - id: deny-unsafe
        name: deny unsafe code
        entry: grep -r "unsafe" crates/ --include="*.rs" --exclude-dir=target
        language: system
        types: [file]
        pass_filenames: false
        always_run: true

      - id: buildifier
        name: buildifier
        entry: bazel run //:buildifier
        language: system
        types: [bazel]
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: '^\.github/workflows/.*\.(ya?ml)$'

      - id: renovate-config-validator
        name: renovate config validator
        entry: npx --yes --package renovate -- renovate-config-validator renovate.json
        language: system
        files: '^(renovate\.json|\.github/renovate\.json)$'
        pass_filenames: false

      - id: changeset-check
        name: changeset present
        entry: bash scripts/changeset_check.sh
        language: system
        # Only enforce for PRs that change source/config; docs-only changes are exempt.
        files: '^(crates/|sdk/typescript/|orbit-cli/|extensions/)'
        pass_filenames: false

      - id: third-party-check
        name: third-party check
        entry: bash scripts/third_party_check.sh
        language: system
        pass_filenames: false

      - id: devtools-workspace-check
        name: workspace member check
        entry: cargo run -q -p tools-workspace -- check
        language: system
        pass_filenames: false
        files: '^(Cargo\.toml|tools/.*/Cargo\.toml|crates/.*/Cargo\.toml)$'

      - id: devtools-version-sync
        name: version sync (Cargo.toml <-> MODULE.bazel)
        entry: bash -c 'v=$(cargo run -q -p tools-version -- show); m=$(grep -m1 "version" MODULE.bazel | grep -oE "[0-9.]+"); [ "$v" = "$m" ] || { echo "version mismatch: Cargo.toml ($v) != MODULE.bazel ($m)"; exit 1; }'
        language: system
        pass_filenames: false
        files: '^(Cargo\.toml|MODULE\.bazel)$'

# Configuration
default_language_version:
  python: python3

# Skip patterns
exclude: |
  (?x)^(
    target/|
    \.git/|
    \.cargo/|
    \.orbit/|
    \.sandbox-home/|
    .*\.sum|
    .*\.lock|
    .*\.pdb|
    .*\.dll|
    .*\.exe|
    .*\.so|
    .*\.dylib|
  )$

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
