[package]
name = "orbit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
orbit-api = { path = "../api" }
orbit-commands = { path = "../commands" }
orbit-compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
orbit-runtime = { path = "../runtime" }
orbit-plugins = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
orbit-tools = { path = "../tools" }

[lints]
workspace = true

[dev-dependencies]
orbit-mock-anthropic-service = { path = "../mock-anthropic-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

