[package]
name = "orbit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
orbit-api = { path = "../api" }
orbit-commands = { path = "../commands" }
orbit-compat-harness = { path = "../compat-harness" }
orbit-core = { path = "../core" }
crossterm = "0.28"
futures-util = "0.3"
orbit-events = { path = "../events" }
orbit-github = { path = "../github" }
orbit-repo = { path = "../repo" }
pulldown-cmark = "0.13"
rustyline = "15"
orbit-runtime = { path = "../runtime" }
orbit-integrations = { path = "../integrations" }
orbit-plugins = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
orbit-tools = { path = "../tools" }

[lints]
workspace = true

[dev-dependencies]
orbit-mock-anthropic-service = { path = "../mock-anthropic-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
